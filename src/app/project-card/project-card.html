<div class="project-card-holder">
    <div class="project-image-holder">
        <img [src]="imageLink()" alt="TODO LATER">
    </div>

    <div class="card-text-body">

        <div class="card-text-others">

            <p class="project-complaince">{{complaince()}}</p>
        </div>
    </div>
</div>
